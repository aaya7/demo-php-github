name: CI - Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish || true

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --testdox

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t php-sqlite-crud:test .

      - name: Run container
        run: |
          docker run -d --name app -p 8118:80 php-sqlite-crud:test
          # Wait for Apache to be ready
          for i in {1..30}; do
            if curl -sf http://localhost:8118/ > /dev/null; then
              echo "App is up!"
              break
            fi
            echo "Waiting for app... ($i)"
            sleep 1
          done

      - name: Smoke test HTTP response
        run: |
          curl -sSf http://localhost:8118/ | grep -q "Product Manager"
          echo "✅ App responds with expected content"

      - name: Docker logs on failure
        if: failure()
        run: docker logs app

      - name: Cleanup
        if: always()
        run: docker rm -f app || true